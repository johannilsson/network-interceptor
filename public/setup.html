<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercept - Setup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #161614;
      --bg-secondary: #1c1c19;
      --bg-tertiary: #24231f;
      --bg-hover: #201f1c;
      --border: #2a2926;
      --border-subtle: #222120;
      --text-primary: #d4d1c8;
      --text-secondary: #8a8780;
      --text-dim: #5c5a55;
      --text-faint: #3d3b37;
      --accent-primary: #d4d1c8;
      --accent-secondary: #8a8780;
      --accent-error: #d47272;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .setup-container {
      max-width: 480px;
      width: 100%;
    }

    .logo {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .setup-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .setup-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      position: relative;
    }

    .step-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(138,135,128,0.15);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
      font-family: 'DM Sans', sans-serif;
    }

    .setup-card h2 {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .setup-card p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .btn-primary {
      display: block;
      width: 100%;
      padding: 10px 1.5rem;
      background: var(--text-primary);
      color: var(--bg-primary);
      border: 1px solid var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.15s;
      border-radius: 8px;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .config-item {
      display: flex;
      align-items: center;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .config-item label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      width: 60px;
      flex-shrink: 0;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
    }

    .config-item code {
      flex: 1;
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .btn-copy {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s;
      white-space: nowrap;
    }

    .btn-copy:hover {
      color: var(--text-secondary);
    }

    .btn-copy.copied {
      color: var(--text-primary);
    }

    .btn-copy-both {
      display: block;
      width: 100%;
      padding: 8px 1rem;
      background: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s;
    }

    .btn-copy-both:hover {
      color: var(--text-primary);
    }

    .btn-copy-both.copied {
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="logo">Intercept</div>
    <div class="setup-title">Proxy Setup</div>

    <section class="setup-card">
      <div class="step-badge">Step 1</div>
      <h2>Certificate</h2>
      <p>Download and install as a trusted root certificate to capture HTTPS traffic.</p>
      <a href="/api/ca-cert" class="btn-primary">Download Certificate</a>
    </section>

    <section class="setup-card">
      <div class="step-badge">Step 2</div>
      <h2>Proxy Configuration</h2>
      <p>Settings &rarr; Wi-Fi &rarr; Configure Proxy &rarr; Manual</p>
      <div class="config-item">
        <label>Server</label>
        <code id="server-value">{{SERVER_IP}}</code>
        <button class="btn-copy" onclick="copy('server-value', this)">Copy</button>
      </div>
      <div class="config-item">
        <label>Port</label>
        <code id="port-value">{{PROXY_PORT}}</code>
        <button class="btn-copy" onclick="copy('port-value', this)">Copy</button>
      </div>
      <button class="btn-copy-both" onclick="copyBoth(this)">Copy Both</button>
    </section>
  </div>

  <script>
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    function showCopied(button) {
      var original = button.textContent;
      button.textContent = 'Copied!';
      button.classList.add('copied');
      setTimeout(function() {
        button.textContent = original;
        button.classList.remove('copied');
      }, 2000);
    }

    function copy(elementId, button) {
      var text = document.getElementById(elementId).textContent;
      copyText(text);
      showCopied(button);
    }

    function copyBoth(button) {
      var server = document.getElementById('server-value').textContent;
      var port = document.getElementById('port-value').textContent;
      copyText(server + ':' + port);
      showCopied(button);
    }
  </script>
</body>
</html>
