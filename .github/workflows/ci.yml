name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on any advisory not listed (with a reason and expiry date) in
      # audit-allowlist.json. See scripts/audit-check.js.
      - name: Audit dependencies
        run: npm run audit:check

      - name: Run tests with coverage
        run: npm run test:coverage
